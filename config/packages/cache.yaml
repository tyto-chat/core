framework:
    cache:
        app: cache.adapter.redis
        default_redis_provider: '%env(CACHE_DSN)%'

        pools:
            cache.rate_limiter:
                adapter: cache.adapter.redis
                default_lifetime: 3600

# Tests must not require a Redis server.
when@test:
    framework:
        cache:
            app: cache.adapter.array
            pools:
                cache.rate_limiter:
                    adapter: cache.adapter.array
                    default_lifetime: 3600
