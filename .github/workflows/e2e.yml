name: E2E

on:
  push:
    branches: [master, "1.0"]
  pull_request:
    branches: [master, "1.0"]

env:
  MERCURE_PUBLISHER_KEY: ci_mercure_publisher_secret_at_least_32_bytes_long
  MERCURE_SUBSCRIBER_KEY: ci_mercure_subscriber_secret_at_least_32_bytes_long

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: db
          MARIADB_USER: db
          MARIADB_PASSWORD: db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mercure:
        image: dunglas/mercure:v0.19
        env:
          SERVER_NAME: "https://localhost:8443, http://:3000"
          MERCURE_PUBLISHER_JWT_KEY: ci_mercure_publisher_secret_at_least_32_bytes_long
          MERCURE_SUBSCRIBER_JWT_KEY: ci_mercure_subscriber_secret_at_least_32_bytes_long
          MERCURE_EXTRA_DIRECTIVES: |
            cors_origins *
            anonymous
        ports:
          - 3000:3000
          - 8443:8443

    steps:
      - name: Resolve client ref (same-name branch, else base-branch pairing)
        id: clientref
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          BASE="${{ github.base_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/tyto-chat/client.git "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          elif [ "$BASE" = "1.0" ]; then
            echo "ref=1.0" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: tyto-chat/client
          ref: ${{ steps.clientref.outputs.ref }}

      - uses: actions/checkout@v4
        with:
          path: core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_mysql, intl, ctype, iconv, gd, imagick, zip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: core/vendor
          key: ${{ runner.os }}-e2e-composer-${{ hashFiles('core/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-composer-

      - name: Install core dependencies
        working-directory: core
        run: composer install --prefer-dist --no-progress

      - name: Configure core test env
        working-directory: core
        run: |
          echo "APP_ENV=test" > .env.local
          cat > .env.test.local <<EOF
          SERVER_API_URL=http://localhost:8000
          MERCURE_URL=http://localhost:3000/.well-known/mercure
          MERCURE_PUBLIC_URL=https://localhost:8443/.well-known/mercure
          MERCURE_JWT_SECRET=${MERCURE_PUBLISHER_KEY}
          MERCURE_SUBSCRIBER_JWT_KEY=${MERCURE_SUBSCRIBER_KEY}
          LIVEKIT_API_KEY=ci_livekit_api_key_at_least_32_bytes_long
          LIVEKIT_API_SECRET=ci_livekit_api_secret_at_least_32_bytes_long
          LIVEKIT_PUBLIC_URL=https://livekit.example.com
          LIVEKIT_INTERNAL_URL=https://livekit.example.com
          CORS_ALLOW_ORIGIN='^http://localhost(:[0-9]+)?$'
          DATABASE_URL="mysql://db:db@127.0.0.1:3306/db?serverVersion=mariadb-11.8.0&charset=utf8mb4"
          APP_MEDIA_SIGNING_KEY=ci_media_signing_key_minimum_32_chars_long!
          EOF
          mkdir -p var/media var/share var/exports

      - name: Prepare core test database
        working-directory: core
        run: |
          mysql -uroot -proot -h127.0.0.1 -e "CREATE DATABASE IF NOT EXISTS db_test; GRANT ALL PRIVILEGES ON db_test.* TO 'db'@'%'; FLUSH PRIVILEGES;"
          php bin/console lexik:jwt:generate-keypair --env=test --skip-if-exists
          APP_ENV=test php bin/console cache:warmup
          APP_ENV=test php bin/console doctrine:migrations:migrate --no-interaction
          APP_ENV=test php bin/console doctrine:fixtures:load --no-interaction

      - name: Serve core (test env)
        working-directory: core
        run: |
          APP_ENV=test PHP_CLI_SERVER_WORKERS=8 nohup php -d variables_order=EGPCS -S 127.0.0.1:8000 -t public public/index.php > /tmp/core-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/server-info > /dev/null && break
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8000/api/v1/server-info > /dev/null; then
            echo "=== response body ==="
            curl -s http://127.0.0.1:8000/api/v1/server-info | head -c 3000 || true
            echo
            echo "=== core server log ==="
            tail -80 /tmp/core-server.log || true
            echo "=== symfony test log ==="
            tail -80 var/log/test.log || true
            exit 1
          fi

      - name: Install client dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build client (e2e mode)
        env:
          VITE_SERVER_INFO_URL: http://localhost:8000/api/server-info
        run: npm run build -- --mode e2e

      - name: Serve client build
        run: |
          nohup npx vite preview --mode e2e > /tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5173/ > /dev/null

      - name: Run Playwright suite
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8000
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-results
            /tmp/core-server.log
            /tmp/vite-preview.log
          retention-days: 7
