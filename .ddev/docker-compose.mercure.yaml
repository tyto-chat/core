services:
    mercure:
        image: dunglas/mercure:v0.19
        restart: unless-stopped
        container_name: "ddev-${DDEV_SITENAME}-mercure"
        labels:
            com.ddev.site-name: ${DDEV_SITENAME}
            com.ddev.approot: ${DDEV_APPROOT}
        expose:
            - "3000"
        environment:
            VIRTUAL_HOST: mercure.${DDEV_SITENAME}.ddev.site
            SERVER_NAME: ":3000"
            HTTP_EXPOSE: "${DDEV_ROUTER_HTTP_PORT}:3000"
            HTTPS_EXPOSE: "${DDEV_ROUTER_HTTPS_PORT}:3000"
            MERCURE_PUBLISHER_JWT_KEY: '${MERCURE_PUBLISHER_JWT_KEY:?missing — run .ddev/generate-secrets.sh (pre-start hook)}'
            MERCURE_SUBSCRIBER_JWT_KEY: '${MERCURE_SUBSCRIBER_JWT_KEY:?missing — run .ddev/generate-secrets.sh (pre-start hook)}'
            MERCURE_EXTRA_DIRECTIVES: |
                cors_origins *
        # Comment the following line to disable the development mode
        command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
        volumes:
            - mercure_data:/data
            - mercure_config:/config

volumes:
    mercure_data:
    mercure_config:
