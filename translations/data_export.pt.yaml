readme:
    title: 'Exportação de dados do Tyto'
    rule: '================='
    generated: 'Gerado:     %generated%'
    account: 'Conta:      %email% (id %userId%)'
    format: 'Formato:    arquivos JSON dentro deste ZIP'

    files_heading: 'Arquivos'
    files_rule: '-----'
    file_profile: 'profile.json         — Perfil da conta, idioma, preferências de notificação'
    file_messages: |
        messages.json        — Todas as mensagens que você escreveu, incluindo todas as
                               versões editadas anteriores. Mensagens excluídas de forma
                               reversível aparecem com isDeleted=true.
    file_conversations: 'conversations.json   — Participações em conversas e os nomes dos outros participantes.'
    file_attachments: |
        attachments.json     — Uploads de arquivos (apenas metadados). Cada entrada inclui
                               uma `signedUrl` que você pode baixar com qualquer cliente
                               HTTP. As URLs valem por %attachmentHours% horas a partir da
                               geração da exportação e têm um limite de
                               %attachmentMaxDownloads% downloads cada — trate-as como
                               segredos. Refaça a exportação para renovar as URLs.
    file_reactions: 'reactions.json       — Reações que você deu em mensagens de outras pessoas.'
    file_moderation: 'moderation.json      — Ações de moderação aplicadas à sua conta.'
    file_notifications: 'notifications.json   — Notificações que você recebeu.'

    excluded_heading: 'O que NÃO está incluído'
    excluded_rule: '--------------------'
    excluded_others_messages: '- Mensagens de outros usuários (mesmo que mencionem você).'
    excluded_mod_notes: '- Notas de moderadores sobre você (exceção do Artigo 15(4): dados internos do operador).'
    excluded_mod_actions_actor: '- Ações de moderação que você aplicou a outros (dados de terceiros).'
    excluded_other: '- Itens fixados, logs de auditoria, bytes dos arquivos anexados.'
