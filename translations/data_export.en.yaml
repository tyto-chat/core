readme:
    title: 'Tyto data export'
    rule: '================='
    generated: 'Generated:  %generated%'
    account: 'Account:    %email% (id %userId%)'
    format: 'Format:     JSON files inside this ZIP'

    files_heading: 'Files'
    files_rule: '-----'
    file_profile: 'profile.json         — Account profile, locale, notification preferences'
    file_messages: |
        messages.json        — Every message you authored, including all prior edit
                               versions. Soft-deleted messages are included with
                               isDeleted=true.
    file_conversations: 'conversations.json   — DM memberships and the other participants'' display names.'
    file_attachments: |
        attachments.json     — File uploads (metadata only). Each entry includes a
                               `signedUrl` you can fetch with any HTTP client. URLs
                               are valid for %attachmentHours% hours from export
                               generation and capped to %attachmentMaxDownloads%
                               downloads each — treat them as secrets. Re-export to
                               refresh URLs.
    file_reactions: 'reactions.json       — Reactions you gave on other people''s messages.'
    file_moderation: 'moderation.json      — Moderation actions taken against your account.'
    file_notifications: 'notifications.json   — Notifications you received.'

    excluded_heading: 'What is NOT included'
    excluded_rule: '--------------------'
    excluded_others_messages: '- Other users'' messages (even if they mentioned you).'
    excluded_mod_notes: '- Moderator notes about you (Article 15(4) carve-out: internal operator data).'
    excluded_mod_actions_actor: '- Moderation actions you issued against others (third-party data).'
    excluded_other: '- Pinned items, audit logs, attachment file bytes.'
